name: Validar GOAT Intelligence
on:
  push:
    branches: [feature/goat-intelligence-v3]
  pull_request:
    paths: ['src/**', 'tests/**', 'catalog/intelligence-inventory.json', 'tools/**', '.github/workflows/intelligence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Conferir scripts locais no Windows PowerShell 5.1
        shell: powershell
        run: ./tools/Confirm-IntelligenceScripts.ps1
      - name: Testar motor, autorizações, reversões e comparação de métricas
        run: dotnet test tests/GoatTweaks.Intelligence.Tests/GoatTweaks.Intelligence.Tests.csproj -c Release --logger trx --results-directory artifacts/tests
      - name: Preparar origem fixada para regressão do catálogo
        run: |
          $ErrorActionPreference = 'Stop'
          $Zip = Join-Path $env:RUNNER_TEMP 'rytunex-origin.zip'
          Invoke-WebRequest 'https://api.github.com/repos/rayenghanmi/RyTuneX/zipball/957885f53beaacfa7322581cafdb9eba5df5726a' -OutFile $Zip
          $Extract = Join-Path $env:RUNNER_TEMP 'rytunex-origin'
          Expand-Archive $Zip $Extract
          $Origin = (Get-ChildItem $Extract -Directory | Select-Object -First 1).FullName
          $Destination = Join-Path ([Environment]::GetFolderPath('UserProfile')) 'repos/src/RyTuneX'
          New-Item (Split-Path $Destination) -ItemType Directory -Force | Out-Null
          Copy-Item $Origin $Destination -Recurse
      - name: Executar regressões das funções existentes
        run: dotnet test tests/GoatTweaks.Tests/GoatTweaks.Tests.csproj -c Release --logger trx --results-directory artifacts/legacy-tests
      - name: Verificar coleta Windows e restauração na VM isolada
        run: dotnet run --project tools/GoatTweaks.IntelligenceProbe/GoatTweaks.IntelligenceProbe.csproj -c Release -- --isolated-github-vm artifacts/intelligence/native
      - name: Compilar pacote e conferir recursos obrigatórios
        run: ./tools/Publish-Release.ps1 -Repository $env:GITHUB_REPOSITORY -Version v3.0.0
      - name: Conferir fluxo e capturar interface real
        shell: powershell
        run: ./tools/Review-IntelligenceHud.ps1
      - name: Guardar verificações e capturas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: goat-intelligence-${{ matrix.runner }}
          path: artifacts/
          retention-days: 30
      - name: Guardar pacote candidato
        uses: actions/upload-artifact@v7
        with:
          name: goat-intelligence-candidate-${{ matrix.runner }}
          path: dist/
          retention-days: 14
